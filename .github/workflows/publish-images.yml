name: 编译并发布 Docker 镜像

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

# 发布 GHCR 镜像需要 packages:write；构建证明还需要 OIDC 与 attestations 权限。
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: 发布 ${{ matrix.name }} 镜像
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # API、数据库迁移和 Celery worker 使用相同的 Python 运行时镜像。
          - name: api
            context: .
            dockerfile: ./Dockerfile
          # Web 使用独立的 Node 构建阶段和 Nginx 运行时镜像。
          - name: web
            context: ./web
            dockerfile: ./web/Dockerfile

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 初始化 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GitHub 容器镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签和元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/metric-pulse-platform-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: 编译并发布镜像
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # 当前生产目标按常见的 x86_64 NAS/服务器构建，避免 Playwright 跨架构构建开销。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: 生成镜像构建证明
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/metric-pulse-platform-${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
